- question: "How long does a home inspection usually take?"
  answer: "Placeholder: most inspections take about 2 to 4 hours depending on the size, age, and condition of the property."
- question: "Should I attend the inspection?"
  answer: "Placeholder: yes, when possible, because attending helps clients understand the property firsthand and ask practical follow-up questions."
- question: "When will I receive the report?"
  answer: "Placeholder: most clients receive a digital report the same day, typically within a few hours of the inspection."
- question: "What does the inspection include?"
  answer: "Placeholder: accessible major systems and visible components, including structure, roofing, exterior, interior, plumbing, electrical, and HVAC."
- question: "Do you inspect new construction homes too?"
  answer: "Placeholder: yes, new construction inspections help identify visible deficiencies and incomplete items before closing or warranty deadlines."
