<section id="testimonials" aria-labelledby="testimonials-heading" class="page-section">
  <div class="page-wrap flex flex-col gap-10 lg:gap-16">
    <header class="flex max-w-2xl flex-col gap-6">
      <p class="eyebrow">Testimonials</p>
      <h2 id="testimonials-heading" class="section-title">Sample feedback from buyers and homeowners.</h2>
      <p class="lede-copy">These are realistic placeholder testimonials written for layout and tone.</p>
    </header>
    <div class="grid grid-cols-1 gap-2 sm:grid-cols-2 xl:grid-cols-3">
    {% for item in site.data.testimonials %}
      <figure class="flex flex-col justify-between gap-8 rounded-lg bg-mist-950/5 p-6 text-sm/7">
        <blockquote class="text-base/7 text-mist-700">
          <p>{{ item.quote }}</p>
        </blockquote>
        <figcaption class="font-medium text-mist-950">{{ item.name }}</figcaption>
      </figure>
    {% endfor %}
    </div>
  </div>
</section>
